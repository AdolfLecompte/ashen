# Profile used by the bar (quickshell). Raw ascii output: the bar
# reads 0-100 values separated by ';' from stdout.
[general]
framerate = 60
bars = 96
autosens = 1
# Silence is still sixty lines a second of zeros, and the shell parses every
# one on its main thread: that was most of its idle cost once nothing else was
# painting. After two quiet seconds cava stops computing and writing, checks
# for sound once a second, and wakes by itself when there is some.
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
noise_reduction = 45
