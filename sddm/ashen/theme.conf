[General]
# The login does not follow the wallpaper: it wears one palette, named here.
# The palettes live in Main.qml (a login in a hue the session never uses is a
# different product for the ten seconds you look at it, so pick one that fits):
#   dusk (default) | forest | midnight | amber | ash
preset=dusk
# Filled in by install/lib/sddm.sh: the one folder sddm can read, where the
# round copy of your face is kept (face.png). Empty = no photo, a glyph instead.
faceDir=
