[General]
# Ashen's own palette, copied from services/Colors.qml. NOT read from the user's
# home: sddm runs as its own user and a home is drwx------, so the live scheme at
# ~/.cache/ashen_scheme.json cannot be seen from here.
#
# The shell is monochrome by default and its accent is a grey-violet, not a
# colour. A login screen that arrives in a hue the session never uses is a
# different product for the ten seconds you look at it.
background=backgrounds/ashen.jpg
surface=#1c1c21
elevated=#2e2e34
snow=#e8e8ec
mist=#9090a0
ash=#4a4a54
ghost=#6e6e7a
accentText=#12121a
error=#c87a7a

radius=22
innerRadius=10
fieldWidth=300
